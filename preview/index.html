<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菲比啾比 · 坐姿九动作整合版</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#44384d;background:#f6f2ed}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 24px 60px}h1{font-size:32px;margin:8px 0 12px}p{line-height:1.8;color:#827487}.eyebrow{color:#947496;font-size:12px;letter-spacing:.12em}.toolbar{background:#f6f2edf5;padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,.download{font:inherit;font-size:13px;border:1px solid #dfd2df;border-radius:20px;padding:9px 14px;background:#fff;color:#6a4d73;cursor:pointer}button:hover{background:#eee2f1}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #947496;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #e5dbe5;background:#fffaf0;border-radius:23px;text-align:center;padding:19px 12px}.card.new{border-color:#bd9cc7}.tag{font-size:11px;color:#987c9f}.card h2{font-size:19px;margin:6px 0}.stage{height:280px;display:grid;place-items:center}img.sprite{width:240px;height:260px;object-fit:contain}.small img.sprite{width:192px;height:208px}.caption{font-size:13px;margin:6px 0}.frame{font-size:11px;color:#ac97b0}.gif{font-size:12px;color:#8b6994;margin-left:8px}.dark .stage{background:#302c39;border-radius:14px}.look{margin-top:22px;display:flex;gap:28px;align-items:center;padding:22px 28px;background:#fffaf0;border:1px solid #e5dbe5;border-radius:23px}.look h2{font-size:20px}.look input{width:min(350px,100%);accent-color:#947496}.look .stage{flex-shrink:0}.note{font-size:13px}.links{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px}a{color:#896192}#error{color:#a33}.download{text-decoration:none}.new .tag{color:#9766a5}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:24px 14px}.grid{grid-template-columns:1fr}.look{flex-direction:column;gap:8px}h1{font-size:26px}}
</style></head><body><main>
<div class="eyebrow">PHOEBE JIUBI · NINE ACTIONS</div><h1>菲比啾比 · 坐姿九动作整合版</h1>
<p>坐着打字、托腮等待、伸懒腰收工，和原来的六组动作放在一起。<br>三个坐姿动作已写入同一份桌宠图集，下面直接播放这份图集。</p>
<div class="toolbar"><button id="play">暂停全部</button><button id="step">全部下一帧</button><button id="restart">从头播放</button><label>速度 <select id="speed"><option value="1">单轮原速</option><option value="0.5">半速观察</option></select></label><button id="size">原尺寸查看</button><button id="background">深色背景</button></div>
<p id="error" role="alert" hidden></p><div class="grid" id="grid" aria-label="完整九动作预览"></div>
<section class="look"><div class="stage"><img class="sprite" id="look" src="assets/9-0.png" alt="十六方向注视"></div><div><div class="eyebrow">原有注视动作保留</div><h2>十六方向注视</h2><label for="direction">拖动查看方向 · <output id="degree">0° · 向上</output></label><p><input id="direction" type="range" min="0" max="15" value="0" step="1"></p><p class="note">注视仍使用原来的站姿形象。</p></div></section>
<p class="note">这里持续循环展示每组动作；半速仅用于观察。Codex 中由实际状态触发，播放次数和切换时机由应用决定。<br>待机仍是站姿，坐姿与待机之间仍会直接换姿势。安装方法见仓库 README；本页是素材预览。</p>
<div class="links"><a class="download" href="../pet/">桌宠文件</a><a href="spritesheet.png">完整图集</a><a href="../README.md">安装与版本说明</a></div>
</main><script src="actions.js"></script><script>
let actions=[],playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=0,ready=false;
const grid=document.querySelector('#grid'),play=document.querySelector('#play');
function label(){play.textContent=playing?'暂停全部':'播放全部'}label();
function render(image,row,col){image.src=`assets/${row}-${col}.png`}
function draw(a){render(a.canvas,a.row,a.frame);a.counter.textContent=`${a.frame+1} / ${a.times.length}`}
function look(){if(!ready)return;const n=Number(document.querySelector('#direction').value);render(document.querySelector('#look'),9+Math.floor(n/8),n%8);const names=['向上','右上','右上','右上','向右','右下','右下','右下','向下','左下','左下','左下','向左','左上','左上','左上'];document.querySelector('#degree').textContent=`${n*22.5}° · ${names[n]}`}
play.addEventListener('click',()=>{playing=!playing;label()});
document.querySelector('#step').addEventListener('click',()=>{if(!ready)return;playing=false;label();actions.forEach(a=>{a.frame=(a.frame+1)%a.times.length;a.elapsed=0;draw(a)})});
document.querySelector('#restart').addEventListener('click',()=>{if(!ready)return;actions.forEach(a=>{a.frame=0;a.elapsed=0;draw(a)});playing=true;label()});
document.querySelector('#speed').addEventListener('change',e=>{speed=Number(e.target.value)});
document.querySelector('#size').addEventListener('click',e=>{const small=document.body.classList.toggle('small');e.target.textContent=small?'放大查看':'原尺寸查看'});
document.querySelector('#background').addEventListener('click',e=>{const dark=document.body.classList.toggle('dark');e.target.textContent=dark?'浅色背景':'深色背景'});
document.querySelector('#direction').addEventListener('input',look);
function tick(now){const dt=last?Math.min(now-last,200)*speed:0;last=now;if(ready&&playing)actions.forEach(a=>{a.elapsed+=dt;let changed=false;while(a.elapsed>=a.times[a.frame]){a.elapsed-=a.times[a.frame];a.frame=(a.frame+1)%a.times.length;changed=true}if(changed)draw(a)});requestAnimationFrame(tick)}
async function init(){try{actions=PET_ACTIONS.map(a=>({...a}));for(const a of actions){const card=document.createElement('section');card.className='card'+(a.row>=6?' new':'');card.innerHTML=`<div class="tag">${a.row>=6?'坐姿更新':'原动作保留'} · ${a.id.toUpperCase()}</div><h2>${a.name}</h2><div class="stage"><img class="sprite" src="assets/${a.row}-0.png" alt="${a.name}"></div><p class="caption">${a.note}</p><span class="frame"></span><a class="gif" href="${a.id}.gif">GIF ↗</a>`;grid.append(card);a.canvas=card.querySelector('img');a.counter=card.querySelector('.frame');a.frame=0;a.elapsed=0;draw(a)}ready=true;look();requestAnimationFrame(tick)}catch(e){const error=document.querySelector('#error');error.hidden=false;error.textContent=e.message}}
init();
</script></body></html>
